<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KeyLab">
  <meta name="description" content="KeyLab：免费开源的互动音乐与 MIDI 学习平台。从音符、节奏和乐理入门，到连接真实 MIDI 键盘。">
  <title>KeyLab · 互动音乐学习</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <a class="skip-link" href="#app-content">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#home" data-view="home" aria-label="KeyLab 首页">
        <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
        <span class="brand-name">keylab<span class="brand-period">.</span><small>INTERACTIVE MUSIC LAB</small></span>
      </a>
      <div class="sidebar-label">学习空间</div>
      <nav class="side-nav">
        <button class="nav-item active" data-view="home"><span class="nav-icon" aria-hidden="true">⌂</span><span>学习概览</span></button>
        <button class="nav-item" data-view="courses"><span class="nav-icon" aria-hidden="true">▤</span><span>互动课程</span><span class="nav-count" id="nav-course-count">0/14</span></button>
        <button class="nav-item" data-view="practice"><span class="nav-icon" aria-hidden="true">✳</span><span>乐理练习</span></button>
        <button class="nav-item" data-view="midi"><span class="nav-icon" aria-hidden="true">⌁</span><span>MIDI 实验室</span><span class="nav-dot" aria-hidden="true"></span></button>
        <button class="nav-item" data-view="progress"><span class="nav-icon" aria-hidden="true">↗</span><span>学习记录</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="mini-progress-card">
          <div class="mini-progress-top"><span>你的学习进度</span><strong id="side-progress-percent">0%</strong></div>
          <div class="progress-track"><span id="side-progress-bar" style="width:0%"></span></div>
          <p>每次练习，都离理解音乐更近一步。</p>
        </div>
        <div class="sidebar-foot"><span class="status-led"></span>本地模式 · 数据保存在此设备</div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark"><span></span><span></span><span></span><span></span></span><strong>keylab<span class="brand-period">.</span></strong></div>
        <div class="topbar-context"><span class="eyebrow" id="top-eyebrow">YOUR MUSIC JOURNEY</span><h1 id="top-title">学习概览</h1></div>
        <div class="topbar-right">
          <span class="connection-pill" id="connection-pill"><span class="status-led" aria-hidden="true"></span><span id="top-device-status">键盘未连接</span></span>
          <button class="avatar-button" data-view="progress" aria-label="查看学习记录">KL</button>
        </div>
      </header>
      <div id="app-content" class="content-area" tabindex="-1"></div>
      <footer class="app-footer"><span>KEYLAB · OPEN MUSIC LEARNING</span><span>免费 · 开源 · 本地优先</span></footer>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="移动端导航">
    <button class="mobile-nav-item active" data-view="home"><span aria-hidden="true">⌂</span><small>首页</small></button>
    <button class="mobile-nav-item" data-view="courses"><span aria-hidden="true">▤</span><small>课程</small></button>
    <button class="mobile-nav-item" data-view="practice"><span aria-hidden="true">✳</span><small>练习</small></button>
    <button class="mobile-nav-item" data-view="midi"><span aria-hidden="true">⌁</span><small>MIDI</small></button>
    <button class="mobile-nav-item" data-view="progress"><span aria-hidden="true">↗</span><small>记录</small></button>
  </nav>

  <div id="update-banner" class="update-banner" role="region" aria-label="应用更新" hidden>
    <span>KeyLab 有新版本可用。</span>
    <button class="btn btn-small btn-primary" data-action="reload-app">立即更新</button>
    <button class="text-link" data-action="dismiss-update">稍后</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <div id="modal-root" class="modal-root" hidden>
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
